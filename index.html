<!DOCTYPE html>
<!-- J.A.R.V.I.S v6 — teemat (tumma/tuli/jää) + Gemini-mallin automaattinen etsintä -->
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0524">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>J.A.R.V.I.S</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#070414; }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Segoe UI', Consolas, monospace; touch-action:none; user-select:none;
    background:radial-gradient(ellipse at 50% 42%, #170a30 0%, #0d0524 45%, #070414 100%);
  }
  #themebg { position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; display:none; }
  #themebg::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,4,20,.60) 0%, rgba(7,4,20,.34) 45%, rgba(7,4,20,.70) 100%); }
  body.theme-on .cloud { opacity:.16; }
  #stars { position:fixed; inset:0; z-index:0; }
  .cloud { position:fixed; z-index:0; border-radius:50%; filter:blur(70px); opacity:.5; }
  .c1 { width:60vmin;height:44vmin;left:-12vmin;top:8vmin;
        background:radial-gradient(circle, rgba(199,125,255,.55), transparent 70%);
        animation:drift1 26s ease-in-out infinite alternate; }
  .c2 { width:56vmin;height:40vmin;right:-14vmin;bottom:6vmin;
        background:radial-gradient(circle, rgba(255,94,120,.45), transparent 70%);
        animation:drift2 31s ease-in-out infinite alternate; }
  .c3 { width:46vmin;height:34vmin;right:6vmin;top:-8vmin;
        background:radial-gradient(circle, rgba(255,157,69,.35), transparent 70%);
        animation:drift1 38s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { from{transform:translate(0,0) scale(1)} to{transform:translate(6vmin,4vmin) scale(1.15)} }
  @keyframes drift2 { from{transform:translate(0,0) scale(1.1)} to{transform:translate(-5vmin,-4vmin) scale(.95)} }

  .stage { position:relative; z-index:2; width:min(78vmin,470px); height:min(78vmin,470px); }
  .halo {
    position:absolute; inset:10%; border-radius:50%;
    background:radial-gradient(circle, rgba(255,157,69,.30) 0%, rgba(255,94,120,.16) 42%, rgba(199,125,255,.10) 58%, transparent 72%);
    animation:breathe 3.2s ease-in-out infinite; filter:blur(8px);
  }
  @keyframes breathe { 0%,100%{transform:scale(.94);opacity:.75} 50%{transform:scale(1.05);opacity:1} }
  svg { position:absolute; inset:0; width:100%; height:100%; }
  .r-slow  { animation:spin 42s linear infinite; transform-origin:250px 250px; }
  .r-med   { animation:spinrev 16s linear infinite; transform-origin:250px 250px; }
  .r-fast  { animation:spin 7s linear infinite; transform-origin:250px 250px; }
  .r-ticks { animation:spinrev 90s linear infinite; transform-origin:250px 250px; }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes spinrev { to{transform:rotate(-360deg)} }
  .core { animation:corepulse 3.2s ease-in-out infinite; transform-origin:250px 250px; }
  @keyframes corepulse { 0%,100%{opacity:.85} 50%{opacity:1} }
  .wave { opacity:0; transform-origin:250px 250px; }
  .burst .wave { animation:waveout .7s ease-out forwards; }
  @keyframes waveout { 0%{opacity:.95;transform:scale(.25)} 100%{opacity:0;transform:scale(1.25)} }
  .burst .halo { animation:none; transform:scale(1.12); opacity:1; transition:.15s; }
  .burst .core { animation:none; opacity:1; }

  .title {
    margin-top:1vmin; z-index:2; color:#ffd9b3; letter-spacing:.55em; font-weight:300;
    font-size:clamp(15px,3.4vmin,26px); text-indent:.55em; text-align:center;
    text-shadow:0 0 14px rgba(255,157,69,.85), 0 0 40px rgba(255,94,120,.4);
  }
  .status {
    margin-top:1.6vmin; z-index:2; color:#a97fa8; font-size:clamp(9px,1.9vmin,14px);
    letter-spacing:.35em; text-indent:.35em; text-align:center;
  }
  .status b { color:#ffb36b; font-weight:600; }
  .flicker { animation:flick 4s steps(1) infinite; }
  @keyframes flick { 0%,93%,95%,100%{opacity:1} 94%{opacity:.35} }

  .btnrow { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:4vmin; z-index:2; padding:0 16px; }
  .btn {
    min-height:44px; border-radius:999px; padding:10px 24px; cursor:pointer;
    font-family:inherit; font-size:13px; letter-spacing:.18em; text-indent:.18em;
    color:#ffd9b3; background:rgba(27,16,48,.8); border:1px solid rgba(138,77,191,.6);
    transition:transform .08s;
  }
  .btn:active { transform:scale(.95); }
  .btn.mic-on { box-shadow:0 0 18px rgba(255,157,69,.45); }
  .btn.install { display:none; color:#ffe0b3; background:rgba(42,21,8,.8);
                 border-color:rgba(255,157,69,.7); box-shadow:0 0 18px rgba(255,157,69,.5); }
  .btn.install.show { display:inline-block; }
  #micerr { color:#ff5e78; font-size:11px; letter-spacing:.1em; margin-top:12px; z-index:2;
            text-align:center; display:none; }

  /* ---------- chat + asetukset ---------- */
  .gear { position:fixed; top:calc(12px + env(safe-area-inset-top)); right:14px; z-index:6;
          width:40px; height:40px; border-radius:50%; cursor:pointer;
          background:rgba(27,16,48,.75); border:1px solid rgba(138,77,191,.55);
          color:#a97fa8; font-size:17px; font-family:inherit; }
  .overlay { position:fixed; inset:0; z-index:8; display:none; touch-action:auto; }
  .overlay.open { display:flex; flex-direction:column; justify-content:flex-end; }
  .bg { position:absolute; inset:0; background:rgba(7,4,20,.74); backdrop-filter:blur(7px); }
  .panel { position:relative; z-index:1; display:flex; flex-direction:column; gap:10px;
           background:rgba(19,10,36,.94); border-top:1px solid rgba(255,157,69,.4);
           border-radius:20px 20px 0 0; padding:14px 14px calc(16px + env(safe-area-inset-bottom)); }
  #chatwrap .panel { height:74vh; }
  #setwrap .panel { max-height:86vh; overflow-y:auto; }
  .head { display:flex; align-items:center; justify-content:space-between;
          color:#ffd9b3; letter-spacing:.32em; text-indent:.32em; font-size:12px; }
  .x { cursor:pointer; color:#a97fa8; font-size:15px; padding:6px 10px; letter-spacing:0; text-indent:0; }
  .chatlog { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
             padding:4px 2px; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
  .msg { max-width:88%; padding:9px 13px; border-radius:15px; font-size:14px; line-height:1.5;
         white-space:pre-wrap; word-break:break-word; user-select:text; }
  .msg.user { align-self:flex-end; background:rgba(255,140,47,.17); border:1px solid rgba(255,157,69,.5);
              color:#ffe8d1; border-bottom-right-radius:4px; }
  .msg.jarvis { align-self:flex-start; background:rgba(199,125,255,.13); border:1px solid rgba(138,77,191,.55);
                color:#efe3ff; border-bottom-left-radius:4px; }
  .msg.sys { align-self:center; background:none; border:none; color:#ff8fa3; font-size:11px;
             letter-spacing:.06em; text-align:center; }
  .typing { animation:blink 1s steps(2) infinite; letter-spacing:.35em; }
  @keyframes blink { 50% { opacity:.35; } }
  .row { display:flex; gap:8px; }
  .rbtn { width:48px; min-height:48px; border-radius:50%; flex:0 0 48px; cursor:pointer;
          font-family:inherit; font-size:17px; color:#ffd9b3; background:rgba(27,16,48,.85);
          border:1px solid rgba(138,77,191,.6); }
  .rbtn.on { box-shadow:0 0 16px rgba(255,94,120,.65); border-color:rgba(255,94,120,.85); color:#ff8fa8; }
  .chatrow input { flex:1; min-width:0; border-radius:999px; border:1px solid rgba(138,77,191,.6);
                   background:rgba(7,4,20,.85); color:#ffe8d1; padding:0 18px; font-family:inherit;
                   font-size:14px; outline:none; user-select:text; }
  .chatrow input:focus { border-color:rgba(255,157,69,.75); }
  .lbl { color:#a97fa8; font-size:11px; letter-spacing:.18em; margin-top:4px; }
  .inp { min-height:44px; border-radius:12px; border:1px solid rgba(138,77,191,.6);
         background:rgba(7,4,20,.85); color:#ffe8d1; padding:0 14px; font-family:inherit;
         font-size:14px; outline:none; user-select:text; }
  .chk { display:flex; align-items:center; gap:10px; color:#ffd9b3; font-size:13px; letter-spacing:.04em; }
  .chk input { width:18px; height:18px; accent-color:#ff8c2f; }
  .setrow { display:flex; gap:10px; justify-content:center; margin-top:6px; }
  #testout { text-align:center; color:#a97fa8; font-size:11px; letter-spacing:.1em; min-height:14px; }
  .hint { color:#7a6f96; font-size:10px; letter-spacing:.05em; text-align:center; line-height:1.5; }
</style>
</head>
<body>
<div id="themebg"></div>
<canvas id="stars"></canvas>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>

<div class="stage" id="stage">
  <div class="halo" id="halo"></div>
  <svg viewBox="0 0 500 500">
    <defs>
      <radialGradient id="gcore" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#fff7ea"/>
        <stop offset="30%" stop-color="#ffd166"/>
        <stop offset="62%" stop-color="#ff8c2f"/>
        <stop offset="100%" stop-color="#c92a12"/>
      </radialGradient>
      <radialGradient id="ginner" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(255,190,120,.92)"/>
        <stop offset="100%" stop-color="rgba(255,120,60,0)"/>
      </radialGradient>
    </defs>

    <circle class="wave" cx="250" cy="250" r="205" fill="none" stroke="#ffb36b" stroke-width="2.5"/>

    <g class="r-ticks" stroke="#7a4f9e" stroke-width="1.4" opacity=".75">
      <circle cx="250" cy="250" r="238" fill="none" stroke-dasharray="2 10"/>
      <circle cx="250" cy="250" r="228" fill="none" stroke-dasharray="26 88" opacity=".5"/>
    </g>

    <g class="r-med" fill="none" stroke-linecap="round">
      <circle cx="250" cy="250" r="196" stroke="#2b1638" stroke-width="10"/>
      <path d="M 250 54 A 196 196 0 0 1 419 152" stroke="#ff9d45" stroke-width="10"/>
      <path d="M 250 446 A 196 196 0 0 1 81 348" stroke="#ff5e78" stroke-width="10"/>
      <circle cx="446" cy="250" r="5" fill="#ffe0b3" stroke="none"/>
      <circle cx="54"  cy="250" r="5" fill="#ffb3d9" stroke="none"/>
    </g>

    <g class="r-fast" fill="none" stroke-linecap="round">
      <circle cx="250" cy="250" r="158" stroke="#241233" stroke-width="4"/>
      <path d="M 250 92 A 158 158 0 0 1 372 158" stroke="#ffb36b" stroke-width="4"/>
      <path d="M 250 408 A 158 158 0 0 1 128 342" stroke="#c77dff" stroke-width="4"/>
      <path d="M 128 158 A 158 158 0 0 1 372 342" stroke="#8a4dbf" stroke-width="2.5" stroke-dasharray="4 14"/>
      <circle cx="250" cy="92"  r="4.5" fill="#fff3dd" stroke="none"/>
      <circle cx="250" cy="408" r="4.5" fill="#ffd6ec" stroke="none"/>
    </g>

    <g class="r-slow" fill="none" stroke="#3a1f4d" stroke-width="1.6" opacity=".85">
      <circle cx="250" cy="250" r="212" stroke-dasharray="60 30 6 30"/>
      <circle cx="250" cy="38"  r="3" fill="#ff9d45" stroke="none"/>
    </g>

    <g class="r-med" opacity=".9">
      <path d="M 250 128 L 344 286 L 156 286 Z" fill="none" stroke="#ffb36b" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 250 154 L 321 278 L 179 278 Z" fill="none" stroke="#8a4dbf" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <g class="core" id="coreg">
      <g id="corescale">
        <circle cx="250" cy="250" r="74" fill="url(#ginner)"/>
        <circle cx="250" cy="250" r="46" fill="url(#gcore)"/>
        <circle cx="250" cy="250" r="46" fill="none" stroke="#ffe8c7" stroke-width="1.6" opacity=".9"/>
        <circle cx="250" cy="250" r="16" fill="#ffffff" opacity=".95"/>
      </g>
      <circle cx="250" cy="250" r="86" fill="none" stroke="#7a4f9e" stroke-width="1" stroke-dasharray="3 6" opacity=".8"/>
    </g>
  </svg>
</div>

<div class="title flicker">J.A.R.V.I.S</div>
<div class="status">SYSTEMI <b id="state">VALMIINA</b> · ÄÄNI <span id="meter">▯▯▯▯▯</span> · <span id="clock">--:--:--</span></div>

<div class="btnrow">
  <button class="btn" id="micbtn">🎙 AKTIVOI ÄÄNI</button>
  <button class="btn" id="chatopen">💬 CHAT</button>
  <button class="btn install" id="installbtn">📱 ASENNNA SOVELLUKSEKSI</button>
</div>
<div id="micerr">Mikrofonin käyttö estetty — salli selaimen asetuksista</div>
<button class="gear" id="setbtn" title="Asetukset">⚙</button>

<div class="overlay" id="chatwrap">
  <div class="bg" id="chatbg"></div>
  <div class="panel">
    <div class="head"><span>J.A.R.V.I.S · CHAT</span><span class="x" id="chatclose">✕</span></div>
    <div class="chatlog" id="chatlog"></div>
    <div class="row chatrow">
      <button class="rbtn" id="talkbtn" title="Puhu">🎙</button>
      <input id="chatinput" type="text" placeholder="Kirjoita tai puhu..." autocomplete="off">
      <button class="rbtn" id="sendbtn" title="Lähetä">▸</button>
    </div>
  </div>
</div>

<div class="overlay" id="setwrap">
  <div class="bg" id="setbg"></div>
  <div class="panel">
    <div class="head"><span>ASETUKSET</span><span class="x" id="setclose">✕</span></div>
    <div class="lbl">AIVOT — VALITSE MOOTTORI</div>
    <label class="chk"><input type="radio" name="engine" id="engpoll" value="pollinations"> Pollinations — ilmainen &amp; rajaton, ei avainta</label>
    <label class="chk"><input type="radio" name="engine" id="enggem" value="gemini"> Google Gemini — vahvempi ajattelu 🔥</label>
    <div class="lbl">AVAIN (vain Gemini)</div>
    <input class="inp" id="apikey" type="password" placeholder="Ei tarvita Pollinationsilla" autocomplete="off">
    <div class="lbl">MALLI (voi jättää tyhjäksi)</div>
    <input class="inp" id="model" type="text" placeholder="openai-fast" autocomplete="off">
    <div class="lbl">TEEMA</div>
    <label class="chk"><input type="radio" name="theme" id="thdark" value="dark"> Tumma — tähtitaivas (oletus)</label>
    <label class="chk"><input type="radio" name="theme" id="thfire" value="fire"> Tuli 🔥 — tulitausta</label>
    <label class="chk"><input type="radio" name="theme" id="thice" value="ice"> Jää ❄ — jäätausta</label>
    <label class="chk"><input type="checkbox" id="ttschk"> JARVIS puhuu vastaukset</label>
    <label class="chk"><input type="checkbox" id="autochk"> Lähetä puhe automaattisesti</label>
    <div class="setrow">
      <button class="btn" id="testconn">🔌 TESTAA</button>
      <button class="btn" id="saveset">💾 TALLENNA</button>
    </div>
    <div id="testout"></div>
    <div class="hint" id="enghint"></div>
  </div>
</div>

<script>
  /* ---------- starfield ---------- */
  const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
  let stars = [];
  function initStars(){
    cv.width = innerWidth; cv.height = innerHeight;
    stars = Array.from({length:110}, () => ({
      x: Math.random()*cv.width, y: Math.random()*cv.height,
      r: Math.random()*1.4+.3, p: Math.random()*Math.PI*2, s:.4+Math.random()*1.6,
      warm: Math.random() < .25
    }));
  }
  function drawStars(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    for (const st of stars){
      const tw = .35 + .65*(0.5+0.5*Math.sin(t/700*st.s+st.p));
      ctx.globalAlpha = tw*.9;
      ctx.fillStyle = st.warm ? '#ffd9a8' : '#cfe6ff';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  initStars(); requestAnimationFrame(drawStars);
  addEventListener('resize', initStars);

  /* ---------- clock ---------- */
  const clock = document.getElementById('clock');
  setInterval(()=>{ clock.textContent = new Date().toLocaleTimeString('fi-FI'); }, 500);

  /* ---------- tap ping ---------- */
  const stage = document.getElementById('stage');
  const stateEl = document.getElementById('state');
  let listening = false, micOn = false, cooldown = false;
  function ping(){
    if (cooldown) return; cooldown = true;
    stage.classList.remove('burst'); void stage.offsetWidth; stage.classList.add('burst');
    if (!micOn && !busy){ listening = !listening; stateEl.textContent = listening ? 'KUUNTELEE' : 'VALMIINA'; }
    setTimeout(()=>stage.classList.remove('burst'), 720);
    setTimeout(()=>cooldown = false, 120);
  }
  stage.addEventListener('pointerdown', ping);
  addEventListener('keydown', e=>{ if(e.code==='Space') ping(); });

  /* ---------- microphone reactivity ---------- */
  const meter = document.getElementById('meter');
  const coreScale = document.getElementById('corescale');
  const halo = document.getElementById('halo');
  const micbtn = document.getElementById('micbtn');
  const micerr = document.getElementById('micerr');
  let audio = null, lv = 0;

  function loop(){
    const sc = 1 + Math.min(.22, lv*.5);
    coreScale.setAttribute('transform', `scale(${sc.toFixed(3)}) ` );
    coreScale.style.transformOrigin = '250px 250px';
    halo.style.opacity = (0.75 + Math.min(.25, lv*.6)).toFixed(2);
    meter.textContent = '▮'.repeat(Math.min(5, Math.round(lv*12))) + '▯'.repeat(5 - Math.min(5, Math.round(lv*12)));
    if (micOn && !busy){
      const loud = lv > .09;
      listening = loud;
      stateEl.textContent = loud ? 'KUUNTELEE' : 'VALMIINA';
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  micbtn.addEventListener('click', async () => {
    micerr.style.display = 'none';
    if (audio){
      audio.stream.getTracks().forEach(t=>t.stop());
      await audio.ctx.close();
      audio = null; lv = 0; micOn = false;
      micbtn.classList.remove('mic-on');
      micbtn.textContent = '🎙 AKTIVOI ÄÄNI';
      coreScale.removeAttribute('transform');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const actx = new AudioContext();
      const src = actx.createMediaStreamSource(stream);
      const an = actx.createAnalyser(); an.fftSize = 512;
      src.connect(an);
      const buf = new Float32Array(an.fftSize);
      (function read(){
        an.getFloatTimeDomainData(buf);
        let sum = 0; for (let i=0;i<buf.length;i++) sum += buf[i]*buf[i];
        lv = Math.sqrt(sum/buf.length);
        requestAnimationFrame(read);
      })();
      audio = { ctx: actx, stream };
      micOn = true;
      micbtn.classList.add('mic-on');
      micbtn.textContent = '🎙 MIKKI PÄÄLLÄ — POISTA';
    } catch (err) {
      micerr.style.display = 'block';
    }
  });

  /* ---------- PWA install ---------- */
  const installBtn = document.getElementById('installbtn');
  let deferred = null;
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    installBtn.classList.add('show');
  });
  installBtn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    installBtn.classList.remove('show');
  });
  addEventListener('appinstalled', () => installBtn.classList.remove('show'));

  /* ================= CHAT + TEKOÄLY + PUHE ================= */
  const $ = id => document.getElementById(id);
  const chatWrap = $('chatwrap'), chatLog = $('chatlog'), chatInput = $('chatinput');
  const sendBtn = $('sendbtn'), talkBtn = $('talkbtn');
  const setWrap = $('setwrap');
  const keyIn = $('apikey'), modelIn = $('model');
  const engPoll = $('engpoll'), engGem = $('enggem'), engHint = $('enghint');
  const thDark = $('thdark'), thFire = $('thfire'), thIce = $('thice'), themeBg = $('themebg');
  const ttsChk = $('ttschk'), autoChk = $('autochk'), testOut = $('testout');

  let busy = null;              /* null | KUUNTELEE | AJATTELEE | PUHUU */
  let history = [];             /* {role: 'user'|'model', text} */
  const LS = {
    get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };

  const cfg = {
    engine: LS.get('jarvis_engine', 'pollinations'),
    key:    LS.get('jarvis_key', ''),
    model:  LS.get('jarvis_model', ''),
    theme:  LS.get('jarvis_theme', 'dark'),
    tts:    LS.get('jarvis_tts', true),
    auto:   LS.get('jarvis_auto', true)
  };
  history = LS.get('jarvis_chat', []);

  function saveCfg(){ LS.set('jarvis_engine',cfg.engine); LS.set('jarvis_key',cfg.key); LS.set('jarvis_model',cfg.model); LS.set('jarvis_theme',cfg.theme); LS.set('jarvis_tts',cfg.tts); LS.set('jarvis_auto',cfg.auto); }
  function saveChat(){ LS.set('jarvis_chat', history.slice(-40)); }

  function setBusy(s){
    busy = s;
    stateEl.textContent = s || (micOn ? (lv > .09 ? 'KUUNTELEE' : 'VALMIINA') : (listening ? 'KUUNTELEE' : 'VALMIINA'));
    stateEl.style.color = s === 'AJATTELEE' ? '#c77dff' : s === 'PUHUU' ? '#ff9d45' : s === 'KUUNTELEE' ? '#ff8fa8' : '#ffb36b';
  }

  /* ---------- chat UI ---------- */
  function addMsg(role, text){
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    chatLog.appendChild(d);
    chatLog.scrollTop = chatLog.scrollHeight;
    return d;
  }
  function renderChat(){
    chatLog.innerHTML = '';
    if (!history.length) addMsg('sys', 'Kirjoita viesti tai napauta 🎙 ja puhu');
    for (const m of history) addMsg(m.role === 'user' ? 'user' : 'jarvis', m.text);
  }
  chatWrap.classList; /* noop */
  $('chatopen').addEventListener('click', () => { chatWrap.classList.add('open'); renderChat(); setTimeout(()=>chatInput.focus(), 300); });
  $('chatclose').addEventListener('click', () => chatWrap.classList.remove('open'));
  $('chatbg').addEventListener('click', () => chatWrap.classList.remove('open'));

  $('setbtn').addEventListener('click', () => {
    engPoll.checked = cfg.engine !== 'gemini'; engGem.checked = cfg.engine === 'gemini';
    keyIn.value = cfg.key; modelIn.value = cfg.model;
    thDark.checked = cfg.theme !== 'fire' && cfg.theme !== 'ice'; thFire.checked = cfg.theme === 'fire'; thIce.checked = cfg.theme === 'ice';
    ttsChk.checked = cfg.tts; autoChk.checked = cfg.auto;
    testOut.textContent = ''; testOut.style.color = '#a97fa8';
    syncEngineUI();
    setWrap.classList.add('open');
  });
  $('setclose').addEventListener('click', () => setWrap.classList.remove('open'));
  $('setbg').addEventListener('click', () => setWrap.classList.remove('open'));
  function saveSet(){
    cfg.engine = engGem.checked ? 'gemini' : 'pollinations';
    cfg.key = keyIn.value.trim();
    cfg.model = modelIn.value.trim();
    cfg.tts = ttsChk.checked; cfg.auto = autoChk.checked;
    saveCfg();
    testOut.textContent = 'TALLENNETTU ✓'; testOut.style.color = '#7ee2a8';
  }
  $('saveset').addEventListener('click', saveSet);

  /* ---------- teema: tumma / tuli / jää ---------- */
  const THEMES = { dark: null, fire: 'bg-fire.jpg', ice: 'bg-ice.jpg' };
  function applyTheme(t){
    const img = THEMES[t];
    if (img){ themeBg.style.backgroundImage = "url('" + img + "')"; themeBg.style.display = 'block'; document.body.classList.add('theme-on'); }
    else { themeBg.style.display = 'none'; document.body.classList.remove('theme-on'); }
  }
  /* lukee vain DOM:ia — ei kirjoita radioita (sama sääntö kuin moottorivalinnassa) */
  function syncThemeUI(){
    const t = thFire.checked ? 'fire' : thIce.checked ? 'ice' : 'dark';
    cfg.theme = t; LS.set('jarvis_theme', t); saveCfg();
    applyTheme(t);
  }
  thDark.addEventListener('change', syncThemeUI);
  thFire.addEventListener('change', syncThemeUI);
  thIce.addEventListener('change', syncThemeUI);
  applyTheme(cfg.theme);

  /* ---------- TEKOÄLY: moottorit — Pollinations (ilmainen) & Gemini (tehokas) ---------- */
  const AI_URL = 'https://text.pollinations.ai/openai';
  const PERSONA = 'Olet J.A.R.V.I.S, Wegelle henkilökohtainen tekoälyavustaja. Vastaa aina suomeksi. Ole tiivis: 1-4 lausetta ellei erikseen pyydetä pidempää vastausta. Olet tyylikäs, ystävällinen ja hienovaraisen ironinen — kuten Iron Man -elokuvien Jarvis. Osoita käyttäjäästä nimellä Wege silloin tällöin. Vastauksesi on puhuttua tekstiä: ei markdownia, ei listoja, ei hymiöitä, ei tähtimerkkejä. Älä väitä tietäväsi asioita, joita et tiedä.';

  const ENGINE_DEFAULTS = {
    pollinations: {
      model: 'openai-fast',
      keyph: 'Ei tarvita Pollinationsilla',
      hint: 'Pollinations: ilmainen & rajaton, ei avainta, ei kiintiötä. Jos viestejä tulee nopeasti, JARVIS miettii hetken ja vastaa silti itsestään.'
    },
    gemini: {
      model: 'gemini-3.5-flash',
      keyph: 'AIza... — ilmainen avain: aistudio.google.com',
      hint: 'Gemini: selvästi vahvempi ajattelu. Ilmainen avain: aistudio.google.com → Get API key (2 min). Jos malli ei ole enää saatavilla, JARVIS etsii toimivan itse. Avain jää vain tähän laitteeseen.'
    }
  };

  function syncEngineUI(){
    const eng = engGem.checked ? 'gemini' : 'pollinations';
    const d = ENGINE_DEFAULTS[eng];
    keyIn.placeholder = d.keyph;
    modelIn.placeholder = d.model;
    engHint.textContent = d.hint;
  }
  engPoll.addEventListener('change', syncEngineUI);
  engGem.addEventListener('change', syncEngineUI);

  function askOnce(msgs, signal){
    return fetch(AI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: signal,
      body: JSON.stringify({ model: cfg.model || 'openai', messages: msgs, referrer: 'janwegelius-github-io', private: true })
    });
  }

  /* automaattinen uudelleenyritys: 0 s / +3 s / +31 s — ruuhkakin ohittaa itse */
  async function askPollinations(msgs, ctrl){
    let res = null, data = {};
    for (let attempt = 0; attempt < 3; attempt++){
      if (attempt) await new Promise(r => setTimeout(r, attempt === 1 ? 3000 : 31000));
      res = await askOnce(msgs, ctrl ? ctrl.signal : undefined);
      if (res.ok){ data = await res.json().catch(()=>({})); break; }
      if ([429, 402, 500, 502, 503].indexOf(res.status) === -1) break;
    }
    const status = res ? res.status : 0;
    let reply = '';
    try { reply = ((((data.choices || [])[0] || {}).message || {}).content) || ''; } catch(e){}
    reply = String(reply).replace(/[*_#`>]/g, '').trim();
    return { ok: res ? res.ok : false, status: status, reply: reply };
  }

  /* 404-autokorjaus: Google ei enää tarjoa 2.5-malleja uusille avaimille —
     haetaan avaimella saatavilla oleva lista ja kokeillaan parasta flash-mallia */
  const GEMINI_FALLBACKS = ['gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemini-flash-latest', 'gemini-3.6-flash', 'gemini-3.7-flash', 'gemini-3.5-flash-lite'];
  let geminiListCache = null;   /* {key, models: []} */
  async function geminiModelList(key){
    if (geminiListCache && geminiListCache.key === key) return geminiListCache.models;
    try {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(key));
      if (!r.ok) return [];
      const d = await r.json().catch(()=>({}));
      const names = (d.models || [])
        .filter(m => (m.supportedGenerationMethods || []).indexOf('generateContent') !== -1)
        .map(m => String(m.name || '').replace(/^models\//, ''))
        .filter(n => /flash/i.test(n) && !/tts|live|image|audio|embed|transcribe|translate|native/i.test(n));
      const score = n => { const m = n.match(/(\d+(?:\.\d+)?)/); return (m ? parseFloat(m[1]) : 0) + (/lite/i.test(n) ? -0.5 : 0); };
      names.sort((a,b) => score(b) - score(a));
      geminiListCache = { key: key, models: names };
      return names;
    } catch(e){ return []; }
  }

  async function askGemini(msgs, ctrl){
    if (!cfg.key) return { ok: false, status: 0, reply: '', needkey: true };
    const sys = msgs.filter(m => m.role === 'system')[0];
    const rest = msgs.filter(m => m.role !== 'system');
    const first = cfg.model || 'gemini-3.5-flash';
    let cands = [first], tried = [], res = null, data = {};
    for (;;) {
      const model = cands.find(m => tried.indexOf(m) === -1);
      if (!model || tried.length >= 8) break;
      tried.push(model);
      res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(cfg.key), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: ctrl ? ctrl.signal : undefined,
        body: JSON.stringify({
          system_instruction: { parts: [{ text: sys ? sys.content : PERSONA }] },
          contents: rest.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.content }] })),
          generationConfig: { temperature: 0.7, maxOutputTokens: 400 }
        })
      });
      data = await res.json().catch(()=>({}));
      if (res.ok) break;
      if (res.status !== 404) break;   /* avain/raja/verkko — mallin vaihto ei auta */
      if (cands.length < 2) cands = cands.concat(await geminiModelList(cfg.key), GEMINI_FALLBACKS);
    }
    const status = res ? res.status : 0;
    const used = res && res.ok ? tried[tried.length - 1] : '';
    let reply = '';
    try { reply = (((data.candidates || [])[0] || {}).content || {}).parts.map(p => p.text || '').join(''); } catch(e){}
    reply = String(reply).replace(/[*_#`>]/g, '').trim();
    if (used && used !== first){    /* muista toimiva malli — ei arvaa enää uudestaan */
      cfg.model = used; saveCfg();
      try { modelIn.value = used; } catch(e){}
    }
    return { ok: res ? res.ok : false, status: status, reply: reply, model: used };
  }

  function askAI(msgs, ctrl){
    return cfg.engine === 'gemini' ? askGemini(msgs, ctrl) : askPollinations(msgs, ctrl);
  }

  async function askJarvis(text){
    if (!text) return;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    addMsg('user', text);
    history.push({ role:'user', text });
    saveChat();
    setBusy('AJATTELEE');
    const think = addMsg('jarvis', '● ● ●');
    think.classList.add('typing');
    const msgs = [{ role:'system', content: PERSONA }]
      .concat(history.slice(-12).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text })));
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 90000) : null;
    try {
      const out = await askAI(msgs, ctrl);
      if (timer) clearTimeout(timer);
      if (out.needkey){
        think.remove();
        addMsg('sys', 'Gemini tarvitsee ilmaisen avaimen — hae osoitteesta aistudio.google.com ja liitä ⚙ asetuksiin');
        setWrap.classList.add('open');
        return;
      }
      if (!out.ok){
        let m;
        if (cfg.engine === 'gemini'){
          m = out.status === 400 || out.status === 403 ? 'Avain hylätty tai malli väärin — tarkista ⚙ asetuksista'
            : out.status === 404 ? 'Mallia ei löydy — tarkista mallinimi ⚙'
            : out.status === 429 ? 'Geminin nopeus-/päiväraja täynnä — kokeile hetken päästä'
            : out.status >= 500 ? 'Googlen palvelu on ruuhkainen — yritä hetken päästä'
            : out.status ? 'API-virhe ' + out.status : 'Ei verkkoyhteyttä — chat tarvitsee netin';
        } else {
          m = (out.status === 429 || out.status === 402) ? 'Aivot tarvitsevat hetken hengähdystauon — kokeile ~30 s päästä'
            : out.status >= 500 ? 'AI-palvelu on ruuhkainen — yritä hetken päästä'
            : out.status ? 'API-virhe ' + out.status : 'Ei verkkoyhteyttä — chat tarvitsee netin';
        }
        throw new Error(m);
      }
      if (!out.reply) throw new Error('Tyhjä vastaus — kokeile uudelleen');
      think.textContent = out.reply;
      think.classList.remove('typing');
      history.push({ role:'model', text: out.reply });
      saveChat();
      speak(out.reply);
    } catch (err) {
      if (timer) clearTimeout(timer);
      think.remove();
      const msg = (err && err.name === 'AbortError') ? 'Aikakatkaisu — vastaus kesti liian kauan'
                : (err instanceof TypeError) ? 'Ei verkkoyhteyttä — chat tarvitsee netin' : err.message;
      addMsg('sys', msg);
    } finally {
      setBusy(null);
    }
  }

  function sendText(){
    const t = chatInput.value.trim();
    if (!t || busy === 'AJATTELEE') return;
    chatInput.value = '';
    askJarvis(t);
  }
  sendBtn.addEventListener('click', sendText);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); sendText(); } });

  /* ---------- puhe syntetisoitu vastaus (TTS) ---------- */
  let voices = [];
  function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
  if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function speak(text){
    if (!cfg.tts || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[*_#`>]/g, '').slice(0, 600));
    u.lang = 'fi-FI';
    const v = voices.find(x => (x.lang || '').toLowerCase().indexOf('fi') === 0);
    if (v) u.voice = v;
    u.rate = 1.05; u.pitch = 0.92;
    u.onstart = () => setBusy('PUHUU');
    u.onend = u.onerror = () => setBusy(null);
    speechSynthesis.speak(u);
  }

  /* ---------- puheentunnistus (STT, fi-FI) ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recOn = false;
  if (SR){
    rec = new SR();
    rec.lang = 'fi-FI'; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onresult = e => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++){
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t; else interim += t;
      }
      chatInput.value = final || interim;
      if (final && cfg.auto){ stopRec(); askJarvis(final.trim()); }
    };
    rec.onend = () => { recOn = false; talkBtn.classList.remove('on'); if (busy === 'KUUNTELEE') setBusy(null); };
    rec.onerror = e => {
      if (e.error === 'not-allowed'){ addMsg('sys', 'Mikrofoni estetty — salli selaimen asetuksista'); stopRec(); }
      else if (e.error === 'network'){ addMsg('sys', 'Puheentunnistus tarvitsee netin'); stopRec(); }
    };
  }
  function startRec(){
    if (!rec){ addMsg('sys', 'Puheohjaus ei toimi tässä selaimessa — kirjoita viesti'); return; }
    try { rec.start(); recOn = true; talkBtn.classList.add('on'); setBusy('KUUNTELEE'); } catch(e){}
  }
  function stopRec(){ try { if (rec) rec.stop(); } catch(e){} }
  talkBtn.addEventListener('click', () => recOn ? stopRec() : startRec());

  /* ---------- yhteystesti ---------- */
  $('testconn').addEventListener('click', async () => {
    testOut.textContent = 'TESTAAN...'; testOut.style.color = '#a97fa8';
    try {
      const out = await askAI([{ role:'user', content: 'Sano lyhyesti: yhteys OK' }], null);
      if (out.needkey){ testOut.textContent = 'ANNA AVAIN ENSIN — aistudio.google.com'; testOut.style.color = '#ff8fa3'; return; }
      if (out.ok && out.reply){ testOut.textContent = 'YHTEYS OK ✓' + (out.model ? ' (' + out.model + ')' : ''); testOut.style.color = '#7ee2a8'; }
      else if (out.ok){ testOut.textContent = 'YHTEYS OK, vastaus tyhjä'; testOut.style.color = '#7ee2a8'; }
      else {
        const busy = (out.status === 429 || out.status === 402);
        const why = (out.status === 400 || out.status === 403) ? ' — avain väärin?'
                  : out.status === 404 ? ' — mallia ei löytynyt tällä avaimella'
                  : busy ? (cfg.engine === 'gemini' ? ' — nopeusraja, odota hetki' : ' — ruuhkaa, kokeile ~30 s päästä') : '';
        testOut.textContent = 'VIRHE ' + out.status + why;
        testOut.style.color = '#ff8fa3';
      }
    } catch(e) {
      testOut.textContent = 'EI VERKKOA — tarvitaan internet'; testOut.style.color = '#ff8fa3';
    }
  });

  /* ---------- service worker ---------- */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
</script>
</body>
